{% extends "base.html" %}

{% block content %}
    <!-- Main content area -->
    <main class="flex-grow flex items-center justify-center p-8">
        <!-- Main content card for the results page -->
        <div class="frosted-glass max-w-full w-full p-8 rounded-3xl shadow-2xl border border-gray-700">
            <h2 class="text-3xl font-bold text-white mb-6 text-center">Scan Results</h2>

            <!-- Table Container for responsiveness -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="bg-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                ID
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Target
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Timestamp
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Output
                            </th>
                        </tr>
                    </thead>
                    <tbody class="bg-gray-900 divide-y divide-gray-700">
                        <!-- Loop through scan results using the correct variable name 'scans' -->
                        {% for result in scans %}
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-200">
                                {{ result.id }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                                {{ result.target }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                                {{ result.created_at }}
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-300">
                                <!-- FIX: The variable name is now correctly 'result.scan_output' -->
                                <pre class="bg-gray-800 text-gray-200 p-2 rounded-md text-xs overflow-x-auto">{{ result.scan_output }}</pre>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- Message for when there are no results -->
            {% if not scans %}
            <p class="text-center text-gray-400 mt-8">No scan results to display yet.</p>
            {% endif %}
        </div>
    </main>
{% endblock %}
