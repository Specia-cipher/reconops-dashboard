{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Account Settings</h2>
  <div class="card">
    <div class="card-body">
      <p><strong>Username:</strong> {{ user.username }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <!-- You can extend this area with forms to update profile info -->
    </div>
  </div>
</div>
{% endblock %}
