{% extends "base.html" %}

{% block content %}
    <!-- Content Card with frosted glass effect from base.html -->
    <div class="frosted-glass max-w-3xl w-full p-6 sm:p-10 md:p-16 rounded-3xl shadow-2xl text-center border border-gray-700">
        <!-- Main welcome message -->
        <div class="flex flex-col items-center justify-center space-y-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21.5c-3.2 0-6.4-.9-9.1-2.6.2-2.1.8-4 1.9-5.7.5-.8 1.1-1.5 1.8-2.2.8-.8 1.6-1.5 2.5-2.2.8-.7 1.7-1.3 2.6-1.8.9-.5 1.9-.9 2.9-1.2 1-.3 2.1-.5 3.2-.5 4.4 0 8 3.6 8 8 0 1.1-.2 2.1-.5 3.1-.3 1-.7 1.9-1.3 2.8-.6.9-1.3 1.7-2.1 2.5s-1.7 1.5-2.6 2.1c-.9.6-1.9 1.1-2.9 1.5-1.1.4-2.2.6-3.3.6z"/>
            </svg>
            <!-- Adjusted the text size to be responsive -->
            <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-extrabold tracking-tight text-white whitespace-nowrap">
                Welcome to ReconOps Dashboard
            </h1>
            <p class="text-xs sm:text-base text-gray-300 max-w-md">
                Your central hub for reconnaissance and reporting.
            </p>
        </div>

        <!-- Call to action/instructions -->
        <div class="mt-8">
            <p class="text-xs sm:text-sm text-gray-400">
                Use the navigation bar above to explore scans, results, logs, and settings.
            </p>
        </div>
    </div>
{% endblock %}
