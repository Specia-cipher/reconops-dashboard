{% extends "base.html" %}

{% block content %}
    <!-- Main content area -->
    <main class="flex-grow flex items-center justify-center p-8">
        <!-- Main content card for the logs page -->
        <div class="frosted-glass max-w-full w-full p-8 rounded-3xl shadow-2xl border border-gray-700">
            <h2 class="text-3xl font-bold text-white mb-6 text-center">System Logs</h2>

            <!-- Table Container for responsiveness -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="bg-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                #
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Timestamp
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Level
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">
                                Message
                            </th>
                        </tr>
                    </thead>
                    <tbody class="bg-gray-900 divide-y divide-gray-700">
                        <!-- Loop through logs -->
                        {% for log in logs %}
                        <tr class="hover:bg-gray-800 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-200">
                                {{ loop.index }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                                {{ log.timestamp }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold 
                                {% if log.level == 'INFO' %}text-cyan-400{% endif %}
                                {% if log.level == 'WARNING' %}text-yellow-400{% endif %}
                                {% if log.level == 'ERROR' %}text-red-400{% endif %}">
                                {{ log.level }}
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-300">
                                {{ log.message }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- Message for when there are no logs -->
            {% if not logs %}
            <p class="text-center text-gray-400 mt-8">No system logs to display yet.</p>
            {% endif %}

        </div>
    </main>
{% endblock %}
